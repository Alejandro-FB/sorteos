<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorteos al azar</title>
<meta name="description" content="Monedas, dados, reparto en partes iguales, ganadores, equipos, números y orden aleatorio.">
<meta name="theme-color" content="#d6492a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sorteos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f2ea; --card:#fffdf8; --ink:#1d1b16; --muted:#6b665b; --line:#e2dbcc;
  --accent:#d6492a; --accent-ink:#fff; --soft:#efe6d6;
  --heads:#c4922a; --tails:#3b6d9e;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#15140f; --card:#1f1d16; --ink:#f1ede3; --muted:#a39c8c; --line:#363226;
    --accent:#ff7a4d; --accent-ink:#1a0f0a; --soft:#2a261a;
    --heads:#d9a842; --tails:#5f93c9;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:780px;margin:0 auto;padding:28px 16px 56px}
header h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(2rem,7vw,2.9rem);margin:0;letter-spacing:-.025em;line-height:1.05}
header p{margin:8px 0 0;color:var(--muted)}

.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:22px 0 16px}
.mode{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer;font:inherit;color:inherit;text-align:left;transition:border-color .15s}
.mode:hover{border-color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mode .ico{font-size:1.3rem;line-height:1}
.mode .lbl{font-weight:600;font-size:.94rem}

.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px}
.card h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.35rem;margin:0 0 4px;letter-spacing:-.01em}
.desc{color:var(--muted);margin:0 0 16px;font-size:.95rem}
.fields{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.fields[hidden]{display:none}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-weight:600;font-size:.9rem}
.hint{font-size:.8rem;color:var(--muted);font-weight:400}
.count{font-size:.8rem;color:var(--muted)}
input[type=number],select,textarea{font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:130px;resize:vertical}
::placeholder{color:var(--muted);opacity:.65}
textarea:focus::placeholder{color:transparent}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.check{display:flex;gap:9px;align-items:flex-start;font-weight:500;font-size:.92rem;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent);width:17px;height:17px;flex:none}

.actions{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;border-radius:999px;padding:11px 22px;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:1.05rem;padding:12px 30px}
.btn:active{transform:scale(.97)}
.btn.small{padding:6px 14px;font-size:.85rem}
.kbd{font-size:.8rem;color:var(--muted)}
.error{color:var(--accent);font-weight:500;margin:12px 0 0}
.error:empty{display:none}

#results{margin-top:16px}
#results[hidden]{display:none}
.res-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.res-head .t{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.15rem}
.res-head .time{color:var(--muted);font-size:.85rem;margin-left:8px;font-weight:400;font-family:"IBM Plex Sans",system-ui,sans-serif}
.note{color:var(--muted);margin:0 0 14px;font-size:.95rem}

.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.stat{background:var(--soft);border-radius:10px;padding:8px 12px;min-width:90px}
.stat .k{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:1.1rem}

.hero{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0 4px;text-align:center}
.hero-txt{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(1.8rem,8vw,2.6rem);letter-spacing:-.02em;line-height:1.1;word-break:break-word}
.hero-sub{color:var(--muted);font-size:.9rem}

.coins,.dice,.nums{display:flex;flex-wrap:wrap;gap:8px}
.coin{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;color:#fff;box-shadow:inset 0 0 0 3px rgba(255,255,255,.3),0 1px 2px rgba(0,0,0,.15)}
.coin.h{background:var(--heads)}
.coin.t{background:var(--tails)}
.coin.big{width:128px;height:128px;font-size:3.2rem;box-shadow:inset 0 0 0 7px rgba(255,255,255,.28),0 3px 10px rgba(0,0,0,.15)}

.die{width:52px;height:52px;border-radius:12px;background:var(--card);border:2px solid var(--ink);display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:1.15rem}
.die.pips{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px}
.pip{width:8px;height:8px;border-radius:50%}
.pip.on{background:var(--ink)}
.die.big{width:110px;height:110px;border-radius:22px;font-size:2.6rem;border-width:3px}
.die.big.pips{padding:14px}
.die.big .pip{width:17px;height:17px}

.freq{display:grid;gap:5px;margin-top:18px}
.freq .ttl{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.fr{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:.85rem}
.fr .bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.fr .bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.fr span:last-child{text-align:right;color:var(--muted)}

.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.group{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.group.left{border-style:dashed}
.group h3{margin:0 0 8px;font-size:1rem;display:flex;justify-content:space-between;gap:8px}
.group h3 .n{color:var(--muted);font-weight:400;font-size:.85rem;white-space:nowrap}
.group ul{margin:0;padding-left:18px}
.group li{margin:2px 0}

.rank{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rank li{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;background:var(--bg);border:1.5px solid var(--line)}
.rank .pos{font-family:"IBM Plex Mono",monospace;min-width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--soft);font-size:.9rem}
.rank li.top .pos{background:var(--accent);color:var(--accent-ink)}

.num{font-family:"IBM Plex Mono",monospace;padding:8px 13px;border-radius:10px;background:var(--soft);font-size:1.1rem}

.pop{animation:pop .35s cubic-bezier(.2,.8,.3,1.2) both;animation-delay:calc(min(var(--i,0),40) * 28ms)}
.coin.pop{animation:flip .55s ease-out both;animation-delay:calc(min(var(--i,0),40) * 22ms)}
.die.pop{animation:roll .5s ease-out both;animation-delay:calc(min(var(--i,0),40) * 25ms)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes flip{from{opacity:0;transform:rotateY(540deg) scale(.6)}to{opacity:1;transform:none}}
@keyframes roll{0%{opacity:0;transform:rotate(-200deg) scale(.5)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pop,.coin.pop,.die.pop{animation:none}}

.install{margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border:1.5px dashed var(--line);border-radius:12px;font-size:.9rem;color:var(--muted)}
.install[hidden]{display:none}
footer{margin-top:28px;color:var(--muted);font-size:.8rem;text-align:center}
@media (max-width:540px){
  .fields{grid-template-columns:1fr}
  .card{padding:16px}
  .modes{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Sorteos al azar</h1>
    <p>Elige el tipo de sorteo, llena los datos y presiona <b>Sortear</b>.</p>
  </header>

  <nav class="modes" id="modes" aria-label="Tipo de sorteo"></nav>

  <section class="card" id="panel">
    <h2 id="p-title"></h2>
    <p class="desc" id="p-desc"></p>
    <div id="p-fields"></div>
    <div class="actions">
      <button class="btn primary" id="go">Sortear</button>
      <span class="kbd">o Ctrl/⌘ + Enter</span>
    </div>
    <p class="error" id="err" role="alert"></p>
  </section>

  <section class="card" id="results" hidden aria-live="polite"></section>

  <div class="install" id="install" hidden>
    <span id="install-txt">Instala esta app en tu dispositivo para usarla sin conexión.</span>
    <button class="btn small" id="install-btn" hidden>Instalar</button>
  </div>

  <footer>Los resultados usan el generador aleatorio criptográfico del navegador (crypto.getRandomValues).</footer>
</div>

<script>
// ---------- utilidades ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fail = msg => { throw new Error(msg); };
const plural = (n, s, p) => n === 1 ? s : p;
const pct = (a, b) => (100 * a / b).toFixed(1).replace(/\.0$/, '') + '%';

// Entero uniforme en [0, n) sin sesgo (muestreo por rechazo)
function rnd(n){
  if (n <= 1) return 0;
  const lim = Math.floor(4294967296 / n) * n;
  const buf = new Uint32Array(1);
  let x;
  do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= lim);
  return x % n;
}
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function int(id){
  const v = $('#' + id).value.trim();
  return /^-?\d+$/.test(v) ? parseInt(v, 10) : NaN;
}
// Si la casilla está vacía se usa el ejemplo (placeholder)
const splitList = t => t.split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);
const list = id => { const el = $('#' + id); return splitList(el.value.trim() ? el.value : el.placeholder); };
const checked = id => $('#' + id).checked;

// ---------- constructores de campos ----------
const F = {
  num: (id, label, val, attrs = '', hint = '') =>
    `<div class="field"><label for="${id}">${label}${hint ? ` <span class="hint">· ${hint}</span>` : ''}</label>
     <input type="number" inputmode="numeric" id="${id}" value="${val}" ${attrs}></div>`,
  list: (id, label, val, unit = ['elemento','elementos']) =>
    `<div class="field full"><label for="${id}">${label} <span class="hint">· uno por línea o separados por coma</span></label>
     <textarea id="${id}" data-unit="${unit.join('|')}" placeholder="${esc(val)}"></textarea><span class="count" data-for="${id}"></span></div>`,
  select: (id, label, opts, sel) =>
    `<div class="field"><label for="${id}">${label}</label><select id="${id}">${
      opts.map(([v, t]) => `<option value="${v}"${String(v) === String(sel) ? ' selected' : ''}>${t}</option>`).join('')
    }</select></div>`,
  check: (id, label, on) =>
    `<div class="field full"><label class="check"><input type="checkbox" id="${id}"${on ? ' checked' : ''}><span>${label}</span></label></div>`
};

// ---------- piezas de resultado ----------
const stats = arr => `<div class="stats">${arr.map(([k, v]) => `<div class="stat"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}</div>`;
const PIPS = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function dieHTML(v, faces, i, big){
  const cls = 'die pop' + (big ? ' big' : '');
  if (faces === 6){
    const on = PIPS[v];
    return `<div class="${cls} pips" style="--i:${i}" aria-label="${v}">${
      Array.from({length:9}, (_, k) => `<span class="pip${on.includes(k) ? ' on' : ''}"></span>`).join('')
    }</div>`;
  }
  return `<div class="${cls}" style="--i:${i}">${v}</div>`;
}
function groupsHTML(groups){
  return `<div class="groups">${groups.map((g, i) =>
    `<div class="group pop${g.left ? ' left' : ''}" style="--i:${i}"><h3><span>${esc(g.name)}</span><span class="n">${g.items.length}</span></h3>${
      g.items.length ? `<ul>${g.items.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<span class="hint">— nada —</span>'
    }</div>`).join('')}</div>`;
}
const groupsText = groups => groups.map(g => `${g.name}: ${g.items.join(', ') || '—'}`).join('\n');
function rankHTML(items, topN){
  return `<ol class="rank">${items.map((x, i) =>
    `<li class="pop${i < topN ? ' top' : ''}" style="--i:${i}"><span class="pos">${i + 1}</span><span>${esc(x)}</span></li>`).join('')}</ol>`;
}

// ---------- modos ----------
const NAMES10 = 'Ana\nBeto\nCarla\nDiego\nElena\nFer\nGaby\nHugo\nIrene\nJorge';

const MODES = [
  {
    id: 'monedas', icon: '🪙', label: 'Monedas',
    title: 'Lanzamiento de monedas', desc: 'Águila o sol. Indica cuántas monedas lanzar.',
    fields: () => F.num('coin-n', '¿Cuántas monedas?', 1, 'min="1" max="1000"', '1 a 1000'),
    run(){
      const n = int('coin-n');
      if (!(n >= 1 && n <= 1000)) fail('Escribe un número de monedas entre 1 y 1000.');
      const r = Array.from({length:n}, () => rnd(2) === 0 ? 'A' : 'S');
      const a = r.filter(x => x === 'A').length, s = n - a;
      if (n === 1){
        const w = r[0] === 'A' ? 'Águila' : 'Sol';
        return {
          html: `<div class="hero"><div class="coin big pop ${r[0] === 'A' ? 'h' : 't'}">${r[0]}</div><div class="hero-txt pop" style="--i:3">${w}</div></div>`,
          text: `Moneda: ${w}`
        };
      }
      return {
        html: stats([['Águila', `${a} · ${pct(a, n)}`], ['Sol', `${s} · ${pct(s, n)}`], ['Lanzamientos', n]]) +
              `<div class="coins">${r.map((c, i) => `<div class="coin pop ${c === 'A' ? 'h' : 't'}" style="--i:${i}" title="${c === 'A' ? 'Águila' : 'Sol'}">${c}</div>`).join('')}</div>`,
        text: `${n} monedas → Águila: ${a} (${pct(a, n)}), Sol: ${s} (${pct(s, n)})\n${r.join(' ')}`
      };
    }
  },
  {
    id: 'dados', icon: '🎲', label: 'Dados',
    title: 'Lanzamiento de dados', desc: 'Elige cuántos dados y de cuántas caras.',
    fields: () => F.num('dice-n', '¿Cuántos dados?', 2, 'min="1" max="100"', '1 a 100') +
      F.select('dice-f', 'Caras por dado', [4,6,8,10,12,20,100].map(f => [f, `d${f} (${f} caras)`]), 6),
    run(){
      const n = int('dice-n'), f = parseInt($('#dice-f').value, 10);
      if (!(n >= 1 && n <= 100)) fail('Escribe un número de dados entre 1 y 100.');
      const r = Array.from({length:n}, () => rnd(f) + 1);
      const sum = r.reduce((a, b) => a + b, 0);
      if (n === 1){
        return { html: `<div class="hero">${dieHTML(r[0], f, 0, true)}<div class="hero-txt pop" style="--i:3">${r[0]}</div><div class="hero-sub">d${f}</div></div>`, text: `1d${f}: ${r[0]}` };
      }
      let html = stats([['Suma', sum], ['Promedio', (sum / n).toFixed(2)], ['Mayor', Math.max(...r)], ['Menor', Math.min(...r)]]) +
                 `<div class="dice">${r.map((v, i) => dieHTML(v, f, i)).join('')}</div>`;
      if (f <= 20){
        const cnt = Array(f).fill(0); r.forEach(v => cnt[v - 1]++);
        const mx = Math.max(...cnt);
        html += `<div class="freq"><div class="ttl">Frecuencia</div>${cnt.map((c, i) =>
          `<div class="fr"><span>${i + 1}</span><div class="bar"><i style="width:${mx ? 100 * c / mx : 0}%"></i></div><span>${c}</span></div>`).join('')}</div>`;
      }
      return { html, text: `${n}d${f}: ${r.join(', ')} (suma ${sum})` };
    }
  },
  {
    id: 'repartir', icon: '🧩', label: 'Repartir',
    title: 'Repartir en partes iguales', desc: 'Reparte elementos (categorías, temas, tareas) entre personas al azar, la misma cantidad para cada una.',
    fields: () => F.list('rep-items', 'Elementos a repartir', 'Ventas\nFinanzas\nLogística\nMarketing\nRecursos Humanos\nOperaciones') +
      F.list('rep-people', 'Personas', 'Ana\nBeto\nCarla', ['persona','personas']) +
      F.check('rep-extra', 'Si no alcanza para partes iguales, repartir los sobrantes (algunas personas, elegidas al azar, reciben uno más)', true),
    run(){
      const I = list('rep-items'), P = list('rep-people'), extra = checked('rep-extra');
      if (!I.length) fail('Agrega al menos un elemento.');
      if (!P.length) fail('Agrega al menos una persona.');
      const items = shuffle(I);
      const base = Math.floor(I.length / P.length), rem = I.length % P.length;
      const assign = P.map(() => []);
      let k = 0;
      for (let p = 0; p < P.length; p++) for (let j = 0; j < base; j++) assign[p].push(items[k++]);
      let left = [];
      if (rem){
        if (extra){ const order = shuffle(P.map((_, i) => i)); for (let j = 0; j < rem; j++) assign[order[j]].push(items[k++]); }
        else left = items.slice(k);
      }
      let note;
      if (!rem) note = `${I.length} ${plural(I.length,'elemento','elementos')} entre ${P.length} ${plural(P.length,'persona','personas')}: ${base} para cada una.`;
      else if (extra) note = `${I.length} entre ${P.length} no da partes iguales: ${base} para cada una y ${rem} ${plural(rem,'persona recibe','personas reciben')} uno más.`;
      else note = `${base} para cada persona; ${rem} ${plural(rem,'elemento queda','elementos quedan')} sin asignar.`;
      const groups = P.map((name, i) => ({ name, items: assign[i] }));
      if (left.length) groups.push({ name: 'Sin asignar', items: left, left: true });
      return { html: `<p class="note">${note}</p>` + groupsHTML(groups), text: note + '\n' + groupsText(groups) };
    }
  },
  {
    id: 'ganadores', icon: '🏆', label: 'Ganadores',
    title: 'Elegir ganadores', desc: 'Elige una o varias personas de una lista, sin repetir.',
    fields: () => F.list('gan-list', 'Participantes', NAMES10, ['participante','participantes']) +
      F.num('gan-n', '¿Cuántos ganadores?', 1, 'min="1"'),
    run(){
      const L = list('gan-list'), k = int('gan-n');
      if (L.length < 1) fail('Agrega al menos un participante.');
      if (!(k >= 1 && k <= L.length)) fail(`El número de ganadores debe estar entre 1 y ${L.length}.`);
      const w = shuffle(L).slice(0, k);
      if (k === 1) return { html: `<div class="hero"><div style="font-size:3rem" class="pop">🏆</div><div class="hero-txt pop" style="--i:3">${esc(w[0])}</div><div class="hero-sub">de ${L.length} ${plural(L.length,'participante','participantes')}</div></div>`, text: `Ganador: ${w[0]}` };
      return { html: `<p class="note">${k} ganadores de ${L.length} participantes, en el orden en que salieron.</p>` + rankHTML(w, 3), text: w.map((x, i) => `${i + 1}. ${x}`).join('\n') };
    }
  },
  {
    id: 'equipos', icon: '👥', label: 'Equipos',
    title: 'Formar equipos', desc: 'Divide una lista de personas en equipos al azar, lo más parejos posible.',
    fields: () => F.list('eq-list', 'Personas', NAMES10, ['persona','personas']) +
      F.select('eq-mode', 'Dividir por', [['n','Número de equipos'], ['size','Personas por equipo']], 'n') +
      F.num('eq-v', 'Cantidad', 2, 'min="1"'),
    run(){
      const L = list('eq-list'), v = int('eq-v'), mode = $('#eq-mode').value;
      if (L.length < 2) fail('Agrega al menos dos personas.');
      if (!(v >= 1)) fail('La cantidad debe ser un número entero mayor que 0.');
      const T = mode === 'n' ? v : Math.ceil(L.length / v);
      if (T > L.length) fail(`No se pueden formar ${T} equipos con ${L.length} personas.`);
      const s = shuffle(L), teams = Array.from({length:T}, () => []);
      s.forEach((x, i) => teams[i % T].push(x));
      const groups = teams.map((t, i) => ({ name: `Equipo ${i + 1}`, items: t }));
      const sizes = [...new Set(teams.map(t => t.length))].sort((a, b) => b - a);
      const note = `${T} equipos de ${sizes.join(' o ')} personas.`;
      return { html: `<p class="note">${note}</p>` + groupsHTML(groups), text: groupsText(groups) };
    }
  },
  {
    id: 'numeros', icon: '🔢', label: 'Números',
    title: 'Número aleatorio', desc: 'Genera uno o varios números enteros dentro de un rango.',
    fields: () => F.num('num-min', 'Desde', 1) + F.num('num-max', 'Hasta', 100) +
      F.num('num-k', '¿Cuántos números?', 1, 'min="1" max="1000"', '1 a 1000') + '<div></div>' +
      F.check('num-unique', 'Sin repetir', true) + F.check('num-sort', 'Ordenar de menor a mayor', false),
    run(){
      const a = int('num-min'), b = int('num-max'), k = int('num-k');
      if (isNaN(a) || isNaN(b)) fail('Escribe números enteros en “Desde” y “Hasta”.');
      if (Math.abs(a) > 1e9 || Math.abs(b) > 1e9) fail('Usa valores entre −1,000,000,000 y 1,000,000,000.');
      if (a > b) fail('“Desde” debe ser menor o igual que “Hasta”.');
      if (!(k >= 1 && k <= 1000)) fail('La cantidad de números debe estar entre 1 y 1000.');
      const range = b - a + 1, uniq = checked('num-unique');
      if (uniq && k > range) fail(`Sin repetir solo caben ${range} números en ese rango.`);
      let r;
      if (!uniq) r = Array.from({length:k}, () => a + rnd(range));
      else if (range <= 5000) r = shuffle(Array.from({length:range}, (_, i) => a + i)).slice(0, k);
      else { const set = new Set(); while (set.size < k) set.add(a + rnd(range)); r = [...set]; }
      if (checked('num-sort')) r.sort((x, y) => x - y);
      const fmt = x => x.toLocaleString('es-MX');
      if (k === 1) return { html: `<div class="hero"><div class="hero-txt pop" style="font-size:clamp(3rem,14vw,5rem);font-family:'IBM Plex Mono',monospace">${fmt(r[0])}</div><div class="hero-sub">entre ${fmt(a)} y ${fmt(b)}</div></div>`, text: `Número: ${r[0]}` };
      return { html: `<p class="note">${k} números entre ${fmt(a)} y ${fmt(b)}${uniq ? ', sin repetir' : ''}.</p><div class="nums">${r.map((x, i) => `<span class="num pop" style="--i:${i}">${fmt(x)}</span>`).join('')}</div>`, text: r.join(', ') };
    }
  },
  {
    id: 'orden', icon: '🔀', label: 'Orden',
    title: 'Orden aleatorio', desc: 'Mezcla una lista para decidir turnos, orden de exposición, etc.',
    fields: () => F.list('ord-list', 'Elementos a ordenar', 'Equipo rojo\nEquipo azul\nEquipo verde\nEquipo amarillo'),
    run(){
      const L = list('ord-list');
      if (L.length < 2) fail('Agrega al menos dos elementos.');
      const s = shuffle(L);
      return { html: rankHTML(s, 1), text: s.map((x, i) => `${i + 1}. ${x}`).join('\n') };
    }
  }
];

// ---------- interfaz ----------
let current = MODES[0], lastText = '';
const modesEl = $('#modes'), fieldsEl = $('#p-fields'), resEl = $('#results'), errEl = $('#err');

modesEl.innerHTML = MODES.map(m =>
  `<button class="mode" data-id="${m.id}" aria-pressed="false"><span class="ico">${m.icon}</span><span class="lbl">${m.label}</span></button>`).join('');
fieldsEl.innerHTML = MODES.map(m => `<div class="fields" data-mode="${m.id}" hidden>${m.fields()}</div>`).join('');

function updateCount(ta){
  const out = document.querySelector(`.count[data-for="${ta.id}"]`);
  if (!out) return;
  const [s, p] = ta.dataset.unit.split('|');
  if (!ta.value.trim()){
    const n = splitList(ta.placeholder).length;
    out.textContent = `Ejemplo con ${n} ${plural(n, s, p)} · se usa si dejas la casilla vacía`;
  } else {
    const n = splitList(ta.value).length;
    out.textContent = `${n} ${plural(n, s, p)}`;
  }
}
fieldsEl.querySelectorAll('textarea').forEach(ta => { updateCount(ta); ta.addEventListener('input', () => updateCount(ta)); });
// En los campos numéricos, al entrar se selecciona el valor para escribir encima sin borrar
fieldsEl.querySelectorAll('input[type=number]').forEach(inp => inp.addEventListener('focus', () => { try { inp.select(); } catch (_) {} }));

function setMode(id){
  const m = MODES.find(x => x.id === id) || MODES[0];
  current = m;
  modesEl.querySelectorAll('.mode').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === m.id));
  fieldsEl.querySelectorAll('.fields').forEach(f => f.hidden = f.dataset.mode !== m.id);
  $('#p-title').textContent = m.title;
  $('#p-desc').textContent = m.desc;
  errEl.textContent = '';
  resEl.hidden = true;
}
modesEl.addEventListener('click', e => {
  const b = e.target.closest('.mode'); if (!b) return;
  setMode(b.dataset.id);
  try { history.replaceState(null, '', '#' + b.dataset.id); } catch (_) {}
});

function go(){
  errEl.textContent = '';
  try {
    const out = current.run();
    lastText = out.text;
    const t = new Date().toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    resEl.innerHTML = `<div class="res-head"><div><span class="t">Resultado</span><span class="time">${t}</span></div>
      <button class="btn small" id="copy">Copiar</button></div>` + out.html;
    resEl.hidden = false;
    const r = resEl.getBoundingClientRect();
    if (r.top > innerHeight * 0.75) resEl.scrollIntoView({behavior:'smooth', block:'start'});
  } catch (e) {
    errEl.textContent = e.message;
    resEl.hidden = true;
  }
}
$('#go').addEventListener('click', go);
document.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); go(); } });
resEl.addEventListener('click', async e => {
  const b = e.target.closest('#copy'); if (!b) return;
  try { await navigator.clipboard.writeText(lastText); b.textContent = '¡Copiado!'; }
  catch (_) { b.textContent = 'No se pudo copiar'; }
  setTimeout(() => { b.textContent = 'Copiar'; }, 1600);
});

function fromHash(){ setMode(location.hash.slice(1)); }
addEventListener('hashchange', fromHash);
fromHash();

// ---------- instalación (PWA) ----------
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
(function(){
  const box = $('#install'), btn = $('#install-btn'), txt = $('#install-txt');
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (standalone) return;
  let deferred = null;
  addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e;
    box.hidden = false; btn.hidden = false;
  });
  btn.addEventListener('click', async () => {
    if (!deferred) return;
    deferred.prompt();
    await deferred.userChoice.catch(() => {});
    deferred = null; box.hidden = true;
  });
  addEventListener('appinstalled', () => { box.hidden = true; });
  // iPhone / iPad: Safari no muestra botón de instalación, se indica el paso manual
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios && location.protocol === 'https:') {
    txt.textContent = 'Para instalarla: toca Compartir y luego “Agregar a pantalla de inicio”.';
    box.hidden = false;
  }
})();
</script>
</body>
